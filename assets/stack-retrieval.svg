<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="317" viewBox="0 0 1200 317" role="img" aria-labelledby="title"><title id="title">Retrieval &amp; search — unified terminal skill icons</title><style>
@keyframes cursor{0%,45%{opacity:1}50%,95%{opacity:0}}
@keyframes breathe{0%,100%{opacity:.28}50%{opacity:.8}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes travel{to{stroke-dashoffset:-100}}
@keyframes reveal{0%,8%{width:0}40%,88%{width:620px}100%{width:0}}
@keyframes scan{0%{transform:translateX(-180px);opacity:0}20%{opacity:.7}80%{opacity:.7}100%{transform:translateX(1180px);opacity:0}}
.cursor{animation:cursor 1.1s steps(1) infinite}.pulse{animation:breathe 4s ease-in-out infinite}.float{animation:float 7s ease-in-out infinite}.flow{stroke-dasharray:4 21;animation:travel 12s linear infinite}.scan{animation:scan 9s ease-in-out infinite}.typing{animation:reveal 12s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.typing{width:620px}}
