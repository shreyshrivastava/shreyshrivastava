<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-labelledby="title desc">
<title id="title">Research → Build → Ship</title>
<desc id="desc">Research, Build, and Ship illuminate in sequence as a signal travels through the workflow. Let’s make something useful.</desc>
<rect width="1200" height="200" rx="18" fill="#0B171D"/>
<g font-family="Arial,sans-serif" font-size="40" font-weight="700" text-anchor="middle">
<text x="320" y="83" fill="#6EE7B7">Research<animate attributeName="opacity" values="1;1;.35;.35;.35;.35;1" keyTimes="0;.16;.33;.5;.66;.83;1" dur="6s" repeatCount="indefinite"/></text>
<text x="485" y="83" fill="#AEC1C7">→</text>
<text x="600" y="83" fill="#93C5FD">Build<animate attributeName="opacity" values=".35;.35;1;1;.35;.35;.35" keyTimes="0;.16;.33;.5;.66;.83;1" dur="6s" repeatCount="indefinite"/></text>
<text x="715" y="83" fill="#AEC1C7">→</text>
<text x="860" y="83" fill="#C4B5FD">Ship<animate attributeName="opacity" values=".35;.35;.35;.35;1;1;.35" keyTimes="0;.16;.33;.5;.66;.83;1" dur="6s" repeatCount="indefinite"/></text>
</g>
<rect x="230" y="111" width="720" height="3" rx="1.5" fill="#24434B"/>
<circle r="6" fill="#6EE7B7"><animateMotion path="M230 112.5 L950 112.5" dur="6s" repeatCount="indefinite"/><animate attributeName="fill" values="#6EE7B7;#93C5FD;#C4B5FD;#6EE7B7" dur="6s" repeatCount="indefinite"/></circle>
<text x="600" y="162" fill="#AEC1C7" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">Let’s make something useful.</text>
</svg>
