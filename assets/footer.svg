<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="174" viewBox="0 0 1200 174" role="img" aria-labelledby="title"><title id="title">Animated research, build, ship pipeline — contact Shrey</title><style>
@keyframes cursor{0%,45%{opacity:1}50%,95%{opacity:0}}
